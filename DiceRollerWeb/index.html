<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Dice Roller</h1>
        </header>

        <div class="tab-navigation">
            <button class="tab-btn active" onclick="switchTab('tab1')">DnD/PF</button>
            <button class="tab-btn" onclick="switchTab('tab2')">SR4+</button>
            <button class="tab-btn" onclick="switchTab('tab3')">Beta</button>
        </div>

        <main>
            <!-- Tab 1: DnD/PF Dice Roller -->
            <div id="tab1" class="tab-content active">
                <section class="dice-section">
                    <h2>Standard Dice</h2>
                    <div class="dice-grid" id="standardDice">
                        <!-- Dice rows will be generated by JavaScript -->
                    </div>
                </section>

                <section class="advantage-section">
                    <h2>d20 with Advantage/Disadvantage</h2>
                    <div class="advantage-buttons">
                        <button class="btn btn-advantage" onclick="rollAdvantage(true)">Roll with Advantage</button>
                        <button class="btn btn-disadvantage" onclick="rollAdvantage(false)">Roll with Disadvantage</button>
                    </div>
                </section>

                <section class="results-section">
                    <h2>Results</h2>
                    <div class="results-container">
                        <textarea id="resultsArea" readonly></textarea>
                        <button class="btn btn-clear" onclick="clearResults()">Clear Results</button>
                    </div>
                </section>
            </div>

            <!-- Tab 2: SR4+ Dice Roller -->
            <div id="tab2" class="tab-content">
                <section class="dice-section">
                    <h2>Select Number of d6 Dice</h2>
                    <div class="sr4-dice-grid" id="sr4DiceGrid">
                        <!-- Number buttons will be generated by JavaScript -->
                    </div>
                </section>

                <section class="sr4-stats-section">
                    <div class="sr4-counters">
                        <div class="counter hits-counter">
                            <span class="counter-label">Hits:</span>
                            <span class="counter-value" id="hitsCount">0</span>
                        </div>
                        <div class="counter misses-counter">
                            <span class="counter-label">Misses:</span>
                            <span class="counter-value" id="missesCount">0</span>
                        </div>
                    </div>
                </section>

                <section class="results-section">
                    <h2>Results</h2>
                    <div class="results-container">
                        <textarea id="sr4ResultsArea" readonly></textarea>
                        <button class="btn btn-clear" onclick="clearSR4Results()">Clear Results</button>
                    </div>
                </section>
            </div>

            <!-- Tab 3: Beta -->
            <div id="tab3" class="tab-content">
                <section class="dice-section">
                    <h2>Beta Features</h2>
                    <p style="text-align: center; padding: 40px; color: #666;">Coming soon...</p>
                </section>
            </div>
        </main>

        <footer>
            <p>&copy; <span id="currentYear"></span> DavidKendig.info</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
